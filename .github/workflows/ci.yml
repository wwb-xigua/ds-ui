name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  verify:
    name: Format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Guards against a missing entry point, a dependency being re-inlined,
      # or eval/new Function reappearing in the bundle.
      - name: Verify build output
        run: npm run verify:build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  smoke:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `needs: build` only orders the jobs — it does NOT share a workspace
      # between them. This job gets a fresh checkout with no dist/, so the
      # artifact from the build job has to be pulled down explicitly. Without
      # it, `npm pack` produces a tarball with no dist/ and the import fails.
      #
      # Note on paths: upload-artifact stores the *contents* of `dist/` at the
      # artifact root, so it has to be downloaded into a directory named `dist`
      # to end up as dist/ds-ui.js again.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Pack
        run: |
          set -euo pipefail
          if [ ! -f dist/ds-ui.js ]; then
            echo "dist/ds-ui.js is missing — the build artifact was not restored." >&2
            echo "Artifact root contains:" >&2
            ls -la | sed 's/^/  /' >&2
            exit 1
          fi
          npm ci --prefer-offline
          npm pack

      # Install the tarball the way a consumer would, then load it through both
      # ESM and CommonJS. This is what caught the `main` field pointing at a file
      # the build never emitted, and lodash-es making the whole CJS bundle
      # unloadable.
      - name: Install packed tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          # A scoped package name produces a `coldboy-ds-ui-<version>.tgz`
          # tarball, so match on the extension rather than the package name.
          npm install "$GITHUB_WORKSPACE"/*.tgz vue naive-ui

      - name: Load via ESM
        working-directory: /tmp/consumer
        run: |
          cat > esm-test.mjs <<'EOF'
          import * as DsUI from '@coldboy/ds-ui';
          const components = ['STable','SForm','SModal','SDrawer','SMessage','SCard','SContainer','SIcon'];
          const missing = components.filter((n) => !DsUI[n]);
          if (missing.length) throw new Error('missing components: ' + missing.join(', '));
          console.log('ESM ok — all components exported');
          EOF
          node esm-test.mjs

      - name: Load via CommonJS
        working-directory: /tmp/consumer
        run: |
          cat > cjs-test.cjs <<'EOF'
          const DsUI = require('@coldboy/ds-ui');
          for (const name of ['STable', 'SForm', 'SMessage']) {
            if (!DsUI[name]) throw new Error('missing component: ' + name);
          }
          if (typeof DsUI.useSTable !== 'function') throw new Error('missing hook: useSTable');
          console.log('CJS ok — require() resolves');
          EOF
          node cjs-test.cjs
