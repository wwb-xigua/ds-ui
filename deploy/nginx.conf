# nginx server block for the ds-ui documentation site.
#
# Intended for 192.168.1.55, which already serves other services on 8080 and
# 8090. This block listens on 8091 so nothing existing is disturbed.
#
# Install:
#   1. copy this file to /etc/nginx/conf.d/ds-ui-docs.conf
#   2. nginx -t && nginx -s reload
#
# The static files are expected at /opt/ds-ui-docs (see scripts/deploy-docs.sh).

server {
    listen 8091;
    listen [::]:8091;

    server_name _;

    root /opt/ds-ui-docs;
    index index.html;

    # VitePress builds with cleanUrls, which means requests arrive without a
    # .html suffix. Try the exact path first, then the .html variant, and fall
    # back to index.html for client-side routing.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Fingerprinted assets never change content, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hashed page chunks, same reasoning. The un-hashed .html files must stay
    # uncached or a deploy would keep serving the previous build.
    location ~ /\.vitepress/.*\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/ds-ui-docs.access.log;
    error_log  /var/log/nginx/ds-ui-docs.error.log;
}

# --- systemd unit to reload nginx-friendly static serving via node, if nginx
# --- is not available. Alternative: skip nginx entirely and run this instead.
#
#   [Unit]
#   Description=ds-ui documentation (static)
#   After=network.target
#
#   [Service]
#   Type=simple
#   WorkingDirectory=/opt/ds-ui-docs
#   ExecStart=/usr/bin/node /opt/serve-static.js 8091 .
#   Restart=always
#
#   [Install]
#   WantedBy=multi-user.target
